# Analyse SonarQube du monorepo (serveur local : conteneur Docker `sonarqube-datashare`, http://localhost:9000).
# Lancement depuis la racine, avec le jeton dans SONAR_TOKEN (voir README).
sonar.projectKey=datashare
sonar.projectName=DataShare
sonar.sourceEncoding=UTF-8

# Code applicatif et tests des trois packages ; un fichier ne peut être que l'un ou l'autre.
sonar.sources=back,front,shared_lib,docker-compose.yml
sonar.tests=back,front,shared_lib
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,back/test/**,front/src/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,back/src/generated/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,back/test/**,front/src/test/**

sonar.typescript.tsconfigPaths=back/tsconfig.json,front/tsconfig.app.json,front/tsconfig.node.json,shared_lib/tsconfig.json
