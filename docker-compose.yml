services:
  db:
    image: postgres:16-alpine
    container_name: datashare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datashare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datashare}
      POSTGRES_DB: ${POSTGRES_DB:-datashare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datashare}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
